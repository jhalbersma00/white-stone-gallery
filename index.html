<!doctype html><html><head><link rel="icon" type="image/png" href="file_000000009d4081f6b264f890662b801c.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100e"><link rel="manifest" href="manifest.webmanifest"><title>White Stone</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>
:root{--b:#11100e;--c:#1c1a17;--g:#c7a65d;--i:#f5ecdc;--m:#aaa08f}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:Georgia,serif}header{padding:18px 15px;border-bottom:1px solid #302b24;position:sticky;top:0;background:#11100ef2;z-index:5}.brand{color:var(--g);letter-spacing:2px;font-size:23px}.sub{color:var(--m);font-size:10px;margin-top:4px}main{max-width:900px;margin:auto;padding:14px 12px 90px}.hero,.card,.box{background:var(--c);border-radius:16px;overflow:hidden}.hero img{width:100%;max-height:58vh;object-fit:cover}.pad{padding:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.card{position:relative}.card img{width:100%;aspect-ratio:4/5;object-fit:cover}.meta{padding:9px}.meta b{font-size:13px}.meta small{display:block;color:var(--m);margin-top:3px}.badge{position:absolute;right:7px;top:7px;background:#111d;padding:5px 7px;border-radius:20px;font:10px sans-serif}.tabs{display:flex;gap:7px;overflow:auto;padding:15px 0}button,.btn{border:0;border-radius:25px;padding:10px 13px;background:var(--g);font-weight:bold;color:#17120b}.secondary{background:#332e26;color:var(--i)}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#171511f5;border-top:1px solid #332e26}.bottom button{border-radius:0;background:transparent;color:var(--m);padding:12px 2px}.bottom .on{color:var(--g)}.box{padding:16px;margin-top:12px}.box h2{margin-top:0;color:var(--g)}label{display:block;color:var(--m);font-size:12px;margin:12px 0 5px}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #453e32;background:#12110f;color:var(--i)}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.admin-card{display:flex;gap:11px;border-bottom:1px solid #332e26;padding:10px 0}.admin-card img{width:72px;height:90px;object-fit:cover;border-radius:8px}.admin-card div{flex:1}.muted{color:var(--m)}dialog{width:min(94vw,650px);border:0;border-radius:15px;background:#171511;color:var(--i);padding:0}dialog::backdrop{background:#000c}dialog img{width:100%;max-height:68vh;object-fit:contain;background:#050505}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body>
<header><div class="brand">WHITE STONE</div><div class="sub">CHRISTIAN GALLERY • SCRIPTURE ART & WALLPAPERS • V3 ADMIN • BUILD 2026-08-15</div></header><main>
<div style="text-align:right;margin-bottom:12px">
  <button id="loginBtn" onclick="netlifyIdentity.open()">Admin Login</button>
</div>
<section id="galleryView"><div class="hero" onclick="view(0)"><img src="art/16953.png"><div class="pad"><b>Featured Artwork</b><div class="muted">Habakkuk 2:20</div></div></div><div id="grid" class="grid"></div></section>
<section id="adminView" class="hidden"><div class="box"><h2>White Stone Admin — V3</h2><p class="muted">Prototype admin. Changes are saved on this device so you can learn the workflow safely.</p><button onclick="newItem()">＋ Add Artwork</button><div id="adminList"></div></div></section>
<section id="editor" class="hidden box"><h2 id="editHeading">Edit Artwork</h2><label>Title</label><input id="title"><label>Scripture / Reference</label><input id="ref"><label>Format</label><select id="format"><option>Print Art</option><option>Phone Wallpaper</option><option>Both</option></select><label>Access</label><select id="premium"><option value="false">Free</option><option value="true">Premium</option></select><label>New Release</label><select id="newrel"><option value="true">Yes</option><option value="false">No</option></select><label>Published</label><select id="published"><option value="true">Published</option><option value="false">Unpublished</option></select><label>Replace / Add image</label><input id="file" type="file" accept="image/*"><div class="row" style="margin-top:16px"><button onclick="saveEdit()">Save Changes</button><button class="secondary" onclick="cancelEdit()">Cancel</button></div></section>
</main><nav class="bottom"><button id="gbtn" class="on" onclick="screen('gallery')">▦<br>Gallery</button><button onclick="alert('Favorites will use the customer account in the cloud version.')">♡<br>Favorites</button><button onclick="alert('New Releases are controlled from Admin.')">✦<br>New</button><button id="abtn" onclick="screen('admin')">⚙<br>Admin</button></nav>
<dialog id="viewer"><img id="vimg"><div class="pad"><h2 id="vt"></h2><p id="vr" class="muted"></p><button class="secondary" onclick="viewer.close()">Close</button></div></dialog>
<script>
const seed=JSON.parse("[[\"Habakkuk 2:20\", \"Habakkuk 2:20\", \"16953.png\", false, true, \"Print Art\"], [\"Habakkuk 2:14\", \"Habakkuk 2:14\", \"16952.png\", false, true, \"Print Art\"], [\"Philippians 3\", \"Philippians 3:7\\u201311\", \"16314.png\", true, true, \"Print Art\"], [\"Psalm 51\", \"Psalm 51:1\\u20132\", \"16292.png\", true, false, \"Print Art\"], [\"Psalm 36\", \"Psalm 36:9\", \"16291.png\", true, false, \"Print Art\"], [\"Psalm 84\", \"Psalm 84:10\\u201312\", \"16273.jpg\", true, false, \"Print Art\"], [\"Heidelberg Catechism\", \"Question & Answer 1\", \"16272.jpg\", true, false, \"Print Art\"], [\"Psalm 27\", \"Psalm 27:1\\u20132\", \"16269.png\", true, false, \"Print Art\"]]"); let data=JSON.parse(localStorage.getItem("ws-admin-catalog")||JSON.stringify(seed)).map(x=>({t:x[0]??x.t,r:x[1]??x.r,f:x[2]??x.f,p:x[3]??x.p,n:x[4]??x.n,fmt:x[5]??x.fmt,pub:x.pub!==false,local:x.local||null}));let editing=-1;
function src(a){return a.local||("art/"+a.f)}function render(){grid.innerHTML="";data.forEach((a,i)=>{if(!a.pub)return;let c=document.createElement("div");c.className="card";c.innerHTML=`<img src="${src(a)}"><div class="meta"><b>${a.t}</b><small>${a.r} • ${a.fmt}</small></div><span class="badge">${a.p?"🔒 PREMIUM":"FREE"}</span>`;c.onclick=()=>view(i);grid.appendChild(c)});adminList.innerHTML="";data.forEach((a,i)=>{let d=document.createElement("div");d.className="admin-card";d.innerHTML=`<img src="${src(a)}"><div><b>${a.t}</b><div class="muted">${a.r}<br>${a.p?"Premium":"Free"} • ${a.pub?"Published":"Unpublished"}</div><div class="row" style="margin-top:7px"><button onclick="editItem(${i})">Edit</button><button class="secondary" onclick="togglePub(${i})">${a.pub?"Unpublish":"Publish"}</button></div></div>`;adminList.appendChild(d)})}
function screen(s){galleryView.classList.toggle("hidden",s!=="gallery");adminView.classList.toggle("hidden",s!=="admin");editor.classList.add("hidden");gbtn.classList.toggle("on",s==="gallery");abtn.classList.toggle("on",s==="admin");render()}
function editItem(i){editing=i;let a=data[i];title.value=a.t;ref.value=a.r;format.value=a.fmt;premium.value=String(a.p);newrel.value=String(a.n);published.value=String(a.pub);adminView.classList.add("hidden");editor.classList.remove("hidden");editHeading.textContent="Edit Artwork"}
function newItem(){editing=-1;title.value="";ref.value="";format.value="Print Art";premium.value="true";newrel.value="true";published.value="true";file.value="";adminView.classList.add("hidden");editor.classList.remove("hidden");editHeading.textContent="Add Artwork"}
function saveEdit(){let base=editing>=0?data[editing]:{f:"",local:null};let finish=(local)=>{let a={...base,t:title.value||"Untitled",r:ref.value||"",fmt:format.value,p:premium.value==="true",n:newrel.value==="true",pub:published.value==="true",local:local??base.local};if(editing>=0)data[editing]=a;else data.push(a);try{localStorage.setItem("ws-admin-catalog",JSON.stringify(data))}catch(e){alert("The image is too large for prototype device storage. Metadata can still be tested; the cloud version will handle full-size uploads.")}screen("admin")};let f=file.files[0];if(f){let rd=new FileReader();rd.onload=()=>finish(rd.result);rd.readAsDataURL(f)}else finish(null)}
function togglePub(i){data[i].pub=!data[i].pub;localStorage.setItem("ws-admin-catalog",JSON.stringify(data));render()}function cancelEdit(){screen("admin")}function view(i){let a=data[i];vimg.src=src(a);vt.textContent=a.t;vr.textContent=a.r;viewer.showModal()}render();
  netlifyIdentity.on("login", user => {
  netlifyIdentity.close();
  screen("admin");
});

netlifyIdentity.on("logout", () => {
  screen("gallery");
});

const loggedInUser = netlifyIdentity.currentUser();
if (loggedInUser) {
  screen("admin");
}
</script></body></html>
